<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DS Server Integration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="main.css">
</head>

<body>

    <nav id="mainNavBar"></nav>

    <button id="testButton">Click to Generate GUID</button>

    <form id="3dsForm">
        <!-- <input type="text" name="mysession" id="mysession"> -->

        <div class="mt-4 container-md">

            <div class="row">
                <div class="col">
                    <input type="hidden" name="merchantId" value="123456789012345">
                    <input type="hidden" name="eventCallbackUrl" value="http://localhost:5126/3DScallback.html">
                    <select name="acctNumber" class="form-select" id="acctSelector">
                        <option value="">Select An Authentication Option</option>
                        <option value="4000000000002701">Successful Frictionless Flow</option>
                        <option value="4100000000005000">Successful Challenge Flow</option>
                        <option value="4100000000100009">Authentication Attempted</option>
                        <option value="4100000000300005">Authentication Failed</option>
                        <option value="4100000000400003">Authentication Unavailable</option>
                        <option value="4100000000500000">Authentication Rejected</option>
                        <option value="4111111111111111">Not Enrolled</option>
                    </select>
                </div>
            </div>

            <div class="row mt-2">
                <button type="submit" class="button-hover form-control button-primary" id="3DSbutton">Submit</button>
            </div>

        </div>
    </form>

    <div class="container-md mt-4">

        <div id="output" class="text"></div>
        <div class="text" id="output-two"></div>

        <iframe src="" id="monUrlFrame" frameborder="0"></iframe>
        <iframe src="" id="threeDSurl" frameborder="0"></iframe>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>


    <script src="utilities.js"></script>

    <script src="3DSWebAdapter.js"></script>

</body>

</html>
