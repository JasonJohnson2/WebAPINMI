    <form id="cloudPaymentForm">

        <div class="container">

            <div class="row p-2 mb-2">

                <div class="col">

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="ResponseMethod" value="synchronous">
                        <label class="form-check-label" for="synchronous">
                            Synchronous
                        </label>
                    </div>
                </div>
                <div class="col">

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="ResponseMethod" value="asynchronous">
                        <label class="form-check-label" for="asynchronous">
                            Asynchronous
                        </label>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <input type="text" name="Amount" class="form-control mb-2" placeholder="Amount">
                <button type="button" class="btn btn-primary" id="cloudButton">Submit</button>
            </div>

        </div>

    </form>
