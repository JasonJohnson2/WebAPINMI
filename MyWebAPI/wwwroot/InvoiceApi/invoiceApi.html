<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMI Invoice Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="../main.css" rel="stylesheet" />
    <link href="../QueryApi/queryApi.css" rel="stylesheet" />
    <link href="invoiceApi.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <div id="mainNavBar"></div>

    <!-- Main Container -->
    <div class="container-fluid mt-4">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
          <div class="query-sidebar">
            <div class="sidebar-header">
              <h5><i class="fas fa-file-invoice-dollar"></i> Invoice Management</h5>
              <p class="text-muted small">Classic API &mdash; transact.php</p>
              <div class="env-toggle-wrapper mt-2">
                <span class="env-label env-sandbox">sandbox</span>
                <div class="form-text mt-1" style="font-size: 0.7rem;">
                  Per docs, this integration always targets sandbox.
                </div>
              </div>
            </div>

            <div class="sidebar-menu">
              <div class="menu-section">
                <h6 class="menu-section-title">Invoice Operations</h6>
                <ul class="menu-items">
                  <li class="menu-item active" data-operation="add_invoice">
                    <i class="fas fa-plus-circle"></i>
                    <span>Create Invoice</span>
                  </li>
                  <li class="menu-item" data-operation="update_invoice">
                    <i class="fas fa-pen-to-square"></i>
                    <span>Update Invoice</span>
                  </li>
                  <li class="menu-item" data-operation="send_invoice">
                    <i class="fas fa-paper-plane"></i>
                    <span>Send Invoice</span>
                  </li>
                  <li class="menu-item" data-operation="close_invoice">
                    <i class="fas fa-circle-xmark"></i>
                    <span>Close Invoice</span>
                  </li>
                </ul>
              </div>

              <div class="menu-section">
                <h6 class="menu-section-title">Reference</h6>
                <ul class="menu-items">
                  <li class="menu-item-link">
                    <a
                      href="https://docs.nmi.com/reference/invoices"
                      target="_blank"
                      rel="noopener"
                    >
                      <i class="fas fa-book"></i>
                      <span>API Docs</span>
                      <i class="fas fa-external-link-alt fa-xs ms-auto"></i>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-9 col-lg-10">
          <div id="invoiceContainer"></div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../utilities.js"></script>
    <script src="invoiceApi.js"></script>
  </body>
</html>
