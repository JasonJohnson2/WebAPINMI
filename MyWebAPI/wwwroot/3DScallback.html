<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>3DSecure 2.0 Authentication</title>
</head>

<body>
    <form>
        <input type="hidden" id="notifyCallback" name="notifyCallback" />
        <input type="hidden" id="transId" name="transId" />
        <input type="hidden" id="param" name="param" />
    </form>

    <script>
        // Extract query parameters from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const requestorTransId = urlParams.get('requestorTransId');
        const event = urlParams.get('event');
        const param = urlParams.get('param');

        // Fetch data from the backend
        fetch(`/callback?requestorTransId=${requestorTransId}&eventParam=${event}&param=${param}`)
            .then(response => {
                if (!response.ok) {
                    console.warn('No callback required for this event.');
                    return; // Exit if no action is needed
                }
                return response.json();
            })
            .then(data => {
                if (!data) return;

                // Populate form inputs with received data
                document.getElementById('notifyCallback').setAttribute('data-th-value', data.Callback);
                document.getElementById('transId').setAttribute('data-th-value', data.TransId);
                document.getElementById('param').setAttribute('data-th-value', data.Param);

                // Execute callback if it exists
                const callbackFn = parent[data.Callback];
                if (typeof callbackFn === 'function') {
                    callbackFn(data.TransId, data.Param);
                }
            })
            .catch(error => console.error('Error fetching callback data:', error));
    </script>
</body>

</html>
