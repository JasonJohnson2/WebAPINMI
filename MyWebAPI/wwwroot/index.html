<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment</title>
  </head>
  <body>
    <label>Credit Card Number</label>
    <div id="ccnumber"></div>

    <label>CC EXP</label>
    <div id="ccexp"></div>

    <label>CVV</label>
    <div id="cvv"></div>

    <button id="payButton">Pay Now</button>

    <div id="threeDSMountPoint"></div>

    <script src="https://secure.nmi.com/js/v1/Gateway.js"></script>
    <script
      src="https://secure.nmi.com/token/Collect.js"
      data-tokenization-key="Mm3Pt3-e6BCRA-329Frx-Ct5T9m"
    ></script>
    <script>
      const gateway = Gateway.create("checkout_public_EenmRhEbNd48J5r9m2v54jgdDQ5eSX72");
      const threeDS = gateway.get3DSecure();

      window.addEventListener("DOMContentLoaded", () => {
        CollectJS.configure({
          variant: "inline",
          callback: (e) => {
            const options = {
              paymentToken: e.token,
              currency: "USD",
              amount: "10.00",
              email: "none@example.com",
              phone: "8008675309",
              city: "New York",
              state: "NY",
              address1: "123 Fist St.",
              country: "US",
              firstName: "John",
              lastName: "Doe",
              postalCode: "60001",
            };

            const threeDSecureInterface = threeDS.createUI(options);
            threeDSecureInterface.start("#threeDSMountPoint");

            threeDSecureInterface.on("challenge", function (e) {
              console.log("Challenged");
            });

            threeDSecureInterface.on("complete", function (e) {
              console.log(e);

              const cardholder_auth = {
                status: e.cardHolderAuth,
                cavv: e.cavv,
                directory_server_id: e.directoryServerId,
                three_ds_version: e.threeDsVersion,
              };

              const finalPayloadToSendItToNmiV5Api = {
                payment_details: {
                  payment_token: options.paymentToken,
                },
                cardholder_auth,
                amount: options.amount,
              };
              console.log(JSON.stringify(finalPayloadToSendItToNmiV5Api));

              fetch("/api/v5/payments/sale", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "FaDMr6C75FG3WK76CR77R2A55cq9QG6J",
                },
                body: JSON.stringify(finalPayloadToSendItToNmiV5Api),
              })
                .then((response) => response.json())
                .then((result) => console.log(result))
                .catch((error) => console.error(error));
            });

            threeDSecureInterface.on("failure", function (e) {
              console.log("failure");
              console.log(e);
            });
          },
        });

        gateway.on("error", function (e) {
          console.error(e);
        });
      });
    </script>
  </body>
</html>
