<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMI Collect.js + V5 API Checkout</title>

    <!--
      Collect.js loader.
      data-tokenization-key: REPLACE with your merchant's PUBLIC tokenization key.
      data-price: initial amount used by the Google Pay button. We re-call
                  CollectJS.configure() on amount change to keep this in sync.
    -->
    <script
      src="https://secure.nmi.com/token/Collect.js"
      data-tokenization-key="3PARw4-HvqS92-q2K2f4-EUHGJz"
      data-variant="inline"
      data-price="10.00"
      data-currency="USD"
      data-country="US"
      data-field-google-pay-selector=".google-pay-button"
      data-field-google-pay-billing-address-required="true"
      data-field-google-pay-billing-address-parameters-format="MIN"
    ></script>

    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #1f2937;
      }
      .card {
        background: #ffffff;
        width: 100%;
        max-width: 480px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        padding: 32px;
      }
      .card h1 {
        margin: 0 0 4px;
        font-size: 1.5rem;
        font-weight: 700;
      }
      .card .subtitle {
        margin: 0 0 24px;
        color: #6b7280;
        font-size: 0.9rem;
      }
      .field { margin-bottom: 14px; }
      .field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .field input[type="text"],
      .field input[type="email"] {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        font-size: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .field input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      }
      .row { display: flex; gap: 12px; }
      .row .field { flex: 1; }

      /* Collect.js iframe containers */
      .cj-field {
        height: 44px;
        padding: 0 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .cj-field.CollectJSValid { border-color: #10b981; }
      .cj-field.CollectJSInvalid { border-color: #ef4444; }

      .pay-button {
        width: 100%;
        height: 48px;
        background: #4f46e5;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s, transform 0.05s;
        margin-top: 8px;
      }
      .pay-button:hover { background: #4338ca; }
      .pay-button:active { transform: translateY(1px); }
      .pay-button:disabled { background: #9ca3af; cursor: not-allowed; }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
        color: #9ca3af;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e7eb;
      }

      .google-pay-button {
        min-height: 48px;
        display: flex;
        justify-content: center;
      }

      .status {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 0.9rem;
        display: none;
      }
      .status.show { display: block; }
      .status.info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
      .status.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
      .status.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

      .status pre {
        margin: 8px 0 0;
        padding: 10px;
        background: rgba(0, 0, 0, 0.04);
        border-radius: 6px;
        font-size: 0.75rem;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        margin-right: 8px;
        vertical-align: middle;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Secure Checkout</h1>
      <p class="subtitle">NMI Collect.js + V5 API</p>

      <!-- Billing -->
      <div class="row">
        <div class="field">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" value="John" />
        </div>
        <div class="field">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" value="Doe" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" value="john@example.com" />
      </div>

      <div class="field">
        <label for="amount">Amount (USD)</label>
        <input type="text" id="amount" value="10.00" inputmode="decimal" />
      </div>

      <!-- Card fields (Collect.js iframes mount here) -->
      <div class="field">
        <label>Card Number</label>
        <div id="ccnumber" class="cj-field"></div>
      </div>
      <div class="row">
        <div class="field">
          <label>Expiration</label>
          <div id="ccexp" class="cj-field"></div>
        </div>
        <div class="field">
          <label>CVV</label>
          <div id="cvv" class="cj-field"></div>
        </div>
      </div>

      <button id="payButton" type="button" class="pay-button">Pay Now</button>

      <div class="divider">OR</div>

      <!-- Collect.js renders the Google Pay button here -->
      <div class="google-pay-button"></div>

      <!-- Status / result area -->
      <div id="status" class="status"></div>
    </div>

    <script>
      (function () {
        // Backend endpoint on the MyWebAPI C# host. Routed by V5ApiController.
        var PROCESS_URL = "/api/v5/checkout/process-payment";

        var amountInput = document.getElementById("amount");
        var payButton = document.getElementById("payButton");
        var statusEl = document.getElementById("status");

        function showStatus(kind, html) {
          statusEl.className = "status show " + kind;
          statusEl.innerHTML = html;
        }
        function hideStatus() {
          statusEl.className = "status";
          statusEl.innerHTML = "";
        }

        function getAmount() {
          var v = (amountInput.value || "").trim();
          return v.length ? v : "0.00";
        }

        // (Re)configure Collect.js. The price needs to match what we'll send
        // to V5; this also keeps the Google Pay sheet showing the right total.
        function configureCollect() {
          if (typeof CollectJS === "undefined") {
            console.warn("[checkout] CollectJS not yet loaded; retrying...");
            return setTimeout(configureCollect, 100);
          }
          var price = getAmount();
          console.log("[checkout] Configuring CollectJS with price:", price);

          CollectJS.configure({
            paymentSelector: "#payButton",
            variant: "inline",
            price: price,
            currency: "USD",
            country: "US",
            styleSniffer: false,
            validCss: { color: "#065f46" },
            invalidCss: { color: "#991b1b" },
            placeholderCss: { color: "#9ca3af" },
            focusCss: { color: "#1f2937" },
            fields: {
              ccnumber: { selector: "#ccnumber", placeholder: "1234 5678 9012 3456" },
              ccexp: { selector: "#ccexp", placeholder: "MM / YY" },
              cvv: { selector: "#cvv", placeholder: "123" }
            },
            callback: handleToken,
            validationCallback: function (field, status, message) {
              console.log("[checkout] field validation", field, status, message);
            },
            fieldsAvailableCallback: function () {
              console.log("[checkout] Collect.js fields are ready");
            }
          });
        }

        // Fired by Collect.js when a token is produced (card OR Google Pay).
        function handleToken(response) {
          console.log("[checkout] CollectJS callback fired:", response);

          if (!response || !response.token) {
            showStatus(
              "error",
              "Tokenization failed — no token returned from Collect.js."
            );
            return;
          }

          var payload = {
            payment_token: response.token,
            amount: getAmount()
          };

          showStatus(
            "info",
            '<span class="spinner"></span>Processing payment via V5 API...'
          );
          payButton.disabled = true;

          console.log("[checkout] POST", PROCESS_URL, payload);

          fetch(PROCESS_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          })
            .then(function (res) {
              return res.text().then(function (text) {
                var body;
                try { body = text ? JSON.parse(text) : {}; }
                catch (_e) { body = { raw: text }; }
                return { status: res.status, body: body };
              });
            })
            .then(function (result) {
              console.log("[checkout] V5 response:", result);
              var body = result.body || {};
              var ok = result.status >= 200 && result.status < 300;
              // V5 returns "status": "approved" on success.
              var approved = (body.status || "").toLowerCase() === "approved";

              if (ok && approved) {
                showStatus(
                  "success",
                  "<strong>Payment approved.</strong>" +
                    "<pre>" + escapeHtml(JSON.stringify(body, null, 2)) + "</pre>"
                );
              } else {
                showStatus(
                  "error",
                  "<strong>Payment failed.</strong>" +
                    "<pre>" + escapeHtml(JSON.stringify(body, null, 2)) + "</pre>"
                );
              }
            })
            .catch(function (err) {
              console.error("[checkout] Network error:", err);
              showStatus(
                "error",
                "Network error: " + escapeHtml(err.message || String(err))
              );
            })
            .finally(function () {
              payButton.disabled = false;
            });
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        // Re-configure when the amount changes so the Google Pay sheet stays in sync.
        var amountDebounce;
        amountInput.addEventListener("input", function () {
          clearTimeout(amountDebounce);
          amountDebounce = setTimeout(function () {
            hideStatus();
            configureCollect();
          }, 400);
        });

        document.addEventListener("DOMContentLoaded", configureCollect);
      })();
    </script>
  </body>
</html>
