<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eKashu Payment</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .payment-card {
        max-width: 500px;
        margin: 50px auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .card-header {
        background: linear-gradient(135deg, #2c3e50, #34495e);
        color: white;
        padding: 30px;
        text-align: center;
      }
      .amount-display {
        font-size: 2.5rem;
        font-weight: 700;
        color: #27ae60;
        margin: 20px 0;
      }
      .payment-button {
        background: linear-gradient(135deg, #27ae60, #2ecc71);
        border: none;
        color: white;
        padding: 15px 30px;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: 600;
        width: 100%;
        transition: all 0.3s ease;
      }
      .payment-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
      }
      .test-info {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        border-radius: 8px;
        padding: 15px;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <div class="payment-card">
      <div class="card-header">
        <h1>eKashu Payment</h1>
        <div class="amount-display">£1.23</div>
      </div>

      <div class="card-body p-4">
        <form action="https://test.ekashu.com" method="post" id="eKashuForm">
          <!-- Core required parameters -->
          <input type="hidden" name="ekashu_amount" value="1.23" />
          <input type="hidden" name="ekashu_currency" value="GBP" />
          <input type="hidden" name="ekashu_description" value="Test Payment" />
          <input type="hidden" name="ekashu_reference" value="TEST-REF-123" />
          <input type="hidden" name="ekashu_seller_id" value="99957823" />
          <input type="hidden" name="ekashu_seller_key" value="2ATtPFQz" />

          <!-- URL parameters -->
          <input
            type="hidden"
            name="ekashu_success_url"
            value="http://localhost:5125/success.html"
          />
          <input
            type="hidden"
            name="ekashu_failure_url"
            value="http://localhost:5125/failure.html"
          />

          <!-- Hash parameters -->
          <input
            type="hidden"
            name="ekashu_hash_code_type"
            value="SHA256HMAC"
          />
          <input type="hidden" name="ekashu_hash_code_version" value="2.0.0" />
          <input type="hidden" name="ekashu_hash_code_format" value="base64" />

          <!-- Additional parameters that might be required -->
          <input type="hidden" name="ekashu_request_type" value="auth" />
          <input type="hidden" name="ekashu_locale" value="en_GB" />

          <!-- CRITICAL: Hash code - MUST be generated dynamically -->
          <input
            type="hidden"
            name="ekashu_hash_code"
            id="ekashu_hash_code"
            value=""
          />

          <div class="mb-3">
            <button type="submit" class="payment-button">
              Proceed to Payment
            </button>
          </div>

          <div class="mb-3">
            <button
              type="button"
              class="btn btn-secondary btn-sm"
              onclick="switchToLocalTest()"
            >
              🔄 Test Locally First
            </button>
            <button
              type="button"
              class="btn btn-info btn-sm"
              onclick="switchToEKashu()"
            >
              🌐 Submit to eKashu
            </button>
          </div>
        </form>

        <div class="test-info">
          <strong>Test Card:</strong> 4100000000000100<br />
          <strong>Expiry:</strong> 08/2025 | <strong>CVV:</strong> 123<br />
          <strong>Name:</strong> Test Card
        </div>

        <div class="mt-3">
          <div class="alert alert-info">
            <strong>eKashu Version 2.0.0 Hash Generation</strong><br />
            Using exact implementation from official eKashu documentation.
          </div>

          <div class="btn-group mb-2" role="group">
            <button
              type="button"
              class="btn btn-info btn-sm"
              onclick="detailedDebug()"
            >
              🔍 Detailed Debug
            </button>
            <button
              type="button"
              class="btn btn-warning btn-sm"
              onclick="testLocalSubmission()"
            >
              🧪 Test Local Submission
            </button>
          </div>

          <div id="debugOutput" class="mt-2" style="display: none">
            <pre
              id="debugContent"
              class="bg-light p-3 border rounded"
              style="font-size: 0.8rem"
            ></pre>
          </div>
        </div>
      </div>
    </div>

    <script>
      let hashGenerated = false;

      // eKashu 2.0.0 Hash Generation with proper error handling
      async function generateHash() {
        console.log("🔄 Starting eKashu hash generation...");

        const formData = new FormData(document.getElementById("eKashuForm"));
        const params = {};

        // Collect all form parameters except the hash code itself
        for (const [key, value] of formData.entries()) {
          if (key !== "ekashu_hash_code") {
            // CRITICAL: Trim whitespace from values as per eKashu requirements
            params[key] = value.trim();
          }
        }

        console.log("📋 Form parameters for hash generation:", params);

        try {
          const response = await fetch("/api/EKashu/generate-hash", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(params),
          });

          if (response.ok) {
            const result = await response.json();
            console.log("✅ Hash generated successfully:", result.hash);

            // Set the generated hash in the form
            document.getElementById("ekashu_hash_code").value = result.hash;
            hashGenerated = true;

            console.log("🔐 Hash set in form field for eKashu submission");

            // Enable form submission
            const submitButton = document.querySelector(".payment-button");
            submitButton.disabled = false;
            submitButton.textContent = "Proceed to Payment";
          } else {
            console.error(
              "❌ Hash generation failed with status:",
              response.status
            );
            const errorText = await response.text();
            console.error("Error details:", errorText);

            // Show error to user
            alert("Hash generation failed. Please try again.");
          }
        } catch (error) {
          console.error("💥 Hash generation error:", error);
          alert(
            "Network error during hash generation. Please check your connection."
          );
        }
      }

      // Prevent form submission until hash is generated
      function handleFormSubmit(event) {
        if (!hashGenerated) {
          event.preventDefault();
          console.warn("⚠️ Form submission blocked - hash not yet generated");
          alert("Please wait for hash generation to complete");
          return false;
        }

        console.log("🚀 Form submitted with valid hash");
        return true;
      }

      // Test specific hash generation method
      async function testHashMethod(method) {
        console.log(`🧪 Testing hash method ${method}...`);

        const formData = new FormData(document.getElementById("eKashuForm"));
        const params = {};

        // Collect all form parameters
        for (const [key, value] of formData.entries()) {
          if (key !== "ekashu_hash_code") {
            params[key] = value.trim();
          }
        }

        try {
          const response = await fetch(
            `/api/EKashu/generate-hash-method/${method}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(params),
            }
          );

          if (response.ok) {
            const result = await response.json();

            // Set this hash in the form and enable submission
            document.getElementById("ekashu_hash_code").value = result.hash;
            hashGenerated = true;

            const submitButton = document.querySelector(".payment-button");
            submitButton.disabled = false;
            submitButton.textContent = `Ready with Method ${method}`;

            // Display result
            const debugOutput = document.getElementById("debugOutput");
            const debugContent = document.getElementById("debugContent");

            debugContent.textContent = JSON.stringify(result, null, 2);
            debugOutput.style.display = "block";

            console.log(`✅ Method ${method} hash:`, result.hash);
            alert(`Hash generated with Method ${method}. Ready to submit!`);
          } else {
            console.error(`❌ Method ${method} failed:`, response.status);
            alert(`Method ${method} failed. Check console for details.`);
          }
        } catch (error) {
          console.error(`💥 Method ${method} error:`, error);
          alert(`Method ${method} network error: ` + error.message);
        }
      }

      // Debug hash generation - shows detailed breakdown
      async function debugHash() {
        console.log("🐛 Starting debug hash generation...");

        const formData = new FormData(document.getElementById("eKashuForm"));
        const params = {};

        // Collect all form parameters
        for (const [key, value] of formData.entries()) {
          if (key !== "ekashu_hash_code") {
            params[key] = value.trim();
          }
        }

        try {
          const response = await fetch("/api/EKashu/debug-hash", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(params),
          });

          if (response.ok) {
            const result = await response.json();

            // Display debug information
            const debugOutput = document.getElementById("debugOutput");
            const debugContent = document.getElementById("debugContent");

            debugContent.textContent = JSON.stringify(result, null, 2);
            debugOutput.style.display = "block";

            console.log("🐛 Debug result:", result);
          } else {
            console.error("❌ Debug failed:", response.status);
            alert("Debug failed. Check console for details.");
          }
        } catch (error) {
          console.error("💥 Debug error:", error);
          alert("Debug network error: " + error.message);
        }
      }

      // Switch form to test locally (our simulation endpoint)
      function switchToLocalTest() {
        const form = document.getElementById("eKashuForm");
        form.action = "/api/EKashu/simulate-ekashu-receive";

        const submitBtn = document.querySelector(".payment-button");
        submitBtn.textContent = "🧪 Test Local Submission";
        submitBtn.className = "btn btn-warning w-100";

        console.log("🔄 Form switched to local testing mode");
        alert(
          "Form now points to local test endpoint. Click 'Test Local Submission' to see what eKashu would receive."
        );
      }

      // Switch form back to eKashu
      function switchToEKashu() {
        const form = document.getElementById("eKashuForm");
        form.action = "https://test.ekashu.com";

        const submitBtn = document.querySelector(".payment-button");
        if (submitBtn) {
          submitBtn.textContent = "Proceed to eKashu Payment";
          submitBtn.className = "payment-button";
        }

        console.log("🌐 Form switched to eKashu submission mode");
        alert("Form now points to eKashu. Ready for real payment submission!");
      }

      // Detailed debugging function
      async function detailedDebug() {
        console.log("🔍 Starting detailed debug...");

        const formData = new FormData(document.getElementById("eKashuForm"));
        const params = {};

        for (const [key, value] of formData.entries()) {
          if (key !== "ekashu_hash_code") {
            params[key] = value.trim();
          }
        }

        try {
          const response = await fetch("/api/EKashu/debug-hash-detailed", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(params),
          });

          if (response.ok) {
            const result = await response.json();

            const debugOutput = document.getElementById("debugOutput");
            const debugContent = document.getElementById("debugContent");

            debugContent.textContent = JSON.stringify(result, null, 2);
            debugOutput.style.display = "block";

            console.log("🔍 Detailed debug result:", result);
          } else {
            console.error("❌ Detailed debug failed:", response.status);
            alert("Detailed debug failed. Check console for details.");
          }
        } catch (error) {
          console.error("💥 Detailed debug error:", error);
          alert("Debug network error: " + error.message);
        }
      }

      // Test local submission (simulate what eKashu receives)
      async function testLocalSubmission() {
        console.log("🧪 Testing local submission...");

        // First generate hash
        await generateHash();

        if (!hashGenerated) {
          alert("Hash generation failed. Cannot test submission.");
          return;
        }

        // Submit form data to our test endpoint
        const form = document.getElementById("eKashuForm");
        const formData = new FormData(form);

        try {
          const response = await fetch("/api/EKashu/simulate-ekashu-receive", {
            method: "POST",
            body: formData, // Send as form data (like eKashu would receive)
          });

          if (response.ok) {
            const result = await response.json();

            const debugOutput = document.getElementById("debugOutput");
            const debugContent = document.getElementById("debugContent");

            debugContent.textContent = JSON.stringify(result, null, 2);
            debugOutput.style.display = "block";

            console.log("🧪 Local submission test result:", result);

            if (result.hashesMatch) {
              alert(
                "✅ Hash validation successful! The hash generation is working correctly."
              );
            } else {
              alert(
                "❌ Hash mismatch detected. Check debug output for details."
              );
            }
          } else {
            console.error("❌ Local submission test failed:", response.status);
            alert("Local submission test failed. Check console for details.");
          }
        } catch (error) {
          console.error("💥 Local submission test error:", error);
          alert("Test network error: " + error.message);
        }
      }

      // Initialize page
      document.addEventListener("DOMContentLoaded", function () {
        // Disable submit button initially
        const submitButton = document.querySelector(".payment-button");
        submitButton.disabled = true;
        submitButton.textContent = "Generating Hash...";

        // Add form submit handler
        document
          .getElementById("eKashuForm")
          .addEventListener("submit", handleFormSubmit);

        // Generate hash using the exact eKashu 2.0.0 implementation
        generateHash();
      });
    </script>
  </body>
</html>
