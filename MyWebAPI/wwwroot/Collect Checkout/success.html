<html>
  <head>
    <title>Collect Checkout</title>
  </head>
  <body>
    <h1>Success</h1>
  </body>
</html>

<div id="checkout_button">Check Out</div>
<script
  src="https://secure.nmi.com/token/CollectCheckout.js"
  data-checkout-key="checkout_public_MfH6RU75T3g27b9D67N6Hu336JyAfb5b"
></script>
<script>
  window.addEventListener("DOMContentLoaded", function (e) {
    document
      .getElementById("checkout_button")
      .addEventListener("click", function (e) {
        CollectCheckout.redirectToCheckout({
          type: "sale",
          lineItems: [
            {
              lineItemType: "customPayment",
              description: "asfa",
              currency: "USD",
            },
          ],
          successUrl: null,
          cancelUrl: null,
          receipt: {
            showReceipt: true,
          },
          collectShippingInfo: true,
          useKount: false,
          paymentMethods: [
            {
              type: "creditCard",
              use3DSecure: false,
            },
            {
              type: "check",
            },
            {
              type: "googlePay",
              use3DSecure: false,
            },
            {
              type: "applePay",
              use3DSecure: false,
            },
          ],
          fields: [
            {
              field: "order_id",
              required: true,
            },
          ],
        }).then((error) => {
          console.log(error);
        });
      });
  });
</script>
<style>
  #checkout_button {
    display: inline-block;
    font-family: sans-serif;
    font-size: 20px;
    background-color: #0bd992;
    color: white;
    border-radius: 4px;
    padding: 14px 28px;
  }
  #checkout_button:hover {
    cursor: pointer;
  }
</style>
