<html>
  <head>
    <title>Collect Checkout</title>
  </head>
  <body>
    <!-- This loads the Collect Checkout JS file. Make sure to use your Checkout key. -->
    <script
      src="https://secure.networkmerchants.com/token/CollectCheckout.js"
      data-checkout-key="checkout_public_MfH6RU75T3g27b9D67N6Hu336JyAfb5b"
    ></script>

    <!-- This is the element on your page that we’re using to trigger Collect Checkout. -->
    <button id="checkout_button_two">Checkout Now</button>

    <div id="checkout_button">Check Out</div>

    <script>
      window.addEventListener("DOMContentLoaded", function (e) {
        document
          .getElementById("checkout_button_two")
          .addEventListener("click", function (e) {
            CollectCheckout.redirectToCheckout({
              type: "sale",
              lineItems: [
                {
                  lineItemType: "purchase",
                  sku: "754167",
                  quantity: 1,
                },
              ],
              successUrl: null,
              cancelUrl: null,
              receipt: {
                showReceipt: true,
                sendToCustomer: true,
              },
              collectShippingInfo: true,
              useKount: false,
              paymentMethods: [
                {
                  type: "creditCard",
                  use3DSecure: false,
                },
                {
                  type: "check",
                },
                {
                  type: "googlePay",
                  use3DSecure: false,
                },
                {
                  type: "applePay",
                  use3DSecure: false,
                },
              ],
              fields: [
                {
                  field: "order_id",
                  value: 123456,
                },
                {
                  field: "merchant_defined_field_1",
                  required: true,
                  value: "Jason",
                },
                {
                  field: "merchant_defined_field_2",
                  required: false,
                },
              ],
            }).then((error) => {
              console.log(error);
            });
          });
      });

      window.addEventListener("DOMContentLoaded", function (e) {
        document
          .getElementById("checkout_button")
          .addEventListener("click", function (e) {
            CollectCheckout.redirectToCheckout({
              type: "sale",
              lineItems: [
                {
                  lineItemType: "purchase",
                  sku: "121212",
                  quantity: 3,
                },
              ],
              successUrl: null,
              cancelUrl: null,
              receipt: {
                showReceipt: true,
                sendToCustomer: true,
              },
              collectShippingInfo: true,
              useKount: false,
              paymentMethods: [
                {
                  type: "creditCard",
                  use3DSecure: false,
                },
                {
                  type: "check",
                },
                {
                  type: "googlePay",
                  use3DSecure: false,
                },
                {
                  type: "applePay",
                  use3DSecure: false,
                },
              ],
              fields: [],
            }).then((error) => {
              console.log(error);
            });
          });
      });
    </script>

    <style>
      #checkout_button {
        display: inline-block;
        font-family: sans-serif;
        font-size: 20px;
        background-color: #0bd992;
        color: white;
        border-radius: 4px;
        padding: 14px 28px;
      }
      #checkout_button:hover {
        cursor: pointer;
      }
    </style>
  </body>
</html>
